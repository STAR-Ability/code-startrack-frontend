name: Publish production image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable main image
        env:
          IMAGE: ghcr.io/star-ability/code-startrack-frontend
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "Version $VERSION already exists; bump package.json before publishing."
            exit 1
          fi
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" .
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          echo "Published $IMAGE:$VERSION and $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear runner registry credentials
        if: always()
        run: docker logout ghcr.io
