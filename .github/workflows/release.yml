name: Publish production image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build-storybook
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:storybook
      - uses: actions/upload-artifact@v4
        with:
          name: release-storybook-${{ github.sha }}
          path: storybook-static/
          retention-days: 14
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable main image
        env:
          IMAGE: ghcr.io/star-ability/code-startrack-frontend
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "Version $VERSION already exists; bump package.json before publishing."
            exit 1
          fi
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" .
          CONTAINER_TEST_IMAGE="$IMAGE:$VERSION" pnpm test:container
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$VERSION, $IMAGE:sha-$GITHUB_SHA and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          DIGEST="$(docker manifest inspect --verbose "$IMAGE:$VERSION" | jq -r '.Descriptor.digest')"
          echo "Digest: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Clear runner registry credentials
        if: always()
        run: docker logout ghcr.io
