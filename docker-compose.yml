services:
  frontend:
    image: ${FRONTEND_IMAGE:-codestartrack-frontend:local}
    build:
      context: .
    pull_policy: missing
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8081}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
