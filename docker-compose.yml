services:
  frontend:
    image: ${FRONTEND_IMAGE:-codestartrack-frontend:local}
    build:
      context: .
    pull_policy: missing
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?Set BACKEND_BASE_URL in the shell or Compose .env}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(2000), redirect: 'error' }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
